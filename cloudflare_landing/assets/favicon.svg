<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Squircle Gradient (Obsidian to Graphite) -->
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D21"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
    
    <!-- Left Facet: Titanium Metallic Refraction -->
    <linearGradient id="monoTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    
    <!-- Right Facet: Monolith Indigo to Electric Violet Glow -->
    <linearGradient id="monoIndigoViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="75%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Bevel Lighting Highlights -->
    <linearGradient id="monoLeftBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Sleek Dark Rounded Backing (App Icon Style) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sqBg)" stroke="#262B34" stroke-width="1.5"/>

  <!-- Monolith Geometric Prism Group -->
  <g filter="url(#prismGlow)">
    <!-- Left Facet Outer & Chamfer -->
    <path d="M30 10 L15 19 L15 45 L30 54 Z" fill="url(#monoTitanium)"/>
    <!-- Left Inner Facet Bevel / Specular Highlight -->
    <path d="M30 10 L23 15 L23 49 L30 54 Z" fill="url(#monoLeftBevel)" opacity="0.45"/>

    <!-- Right Facet (Glowing Indigo / Violet) -->
    <path d="M34 10 L49 19 L49 45 L34 54 Z" fill="url(#monoIndigoViolet)"/>
    <!-- Right Facet Inner Bevel (Electric Specular Edge) -->
    <path d="M34 10 L41 15 L41 49 L34 54 Z" fill="#DDD6FE" opacity="0.35"/>
  </g>
</svg>
