name: MONOLITH CI - Autonomous Engineering System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-static-analysis:
    name: Lint & Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint with Ruff
        run: |
          # Stop build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82 --show-source
          # Warning level checks
          ruff check . --exit-zero

  unit-and-security-tests:
    name: Unit & Security Policy Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Core Security, Role, Approval & Execution Tests
        run: |
          pytest tests/test_agent_roles.py tests/test_approval_lifecycle.py tests/test_execution_broker.py tests/test_security_audit_remediation.py -v

      - name: Run Workspace & Orchestrator Integration Suite
        run: |
          pytest tests/test_workspace_and_orchestrator.py -v
